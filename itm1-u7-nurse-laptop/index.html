{
 "id": "itm1-u7-nurse-laptop",

 "ticket": "Ticket 4",
 "device": "Nurse's laptop",

    "settings"

    "program"

   "id": "replace",

   "id": "saver",
   "label": "Leave battery saver on and lower the brightness",

   "id": "newlaptop",
   "label": "Replace the whole laptop",

   "id": "drain",

   "label": "Drain the battery completely every week",
   "good": false,

   "label": "Never charge it overnight",
   "good": false,
